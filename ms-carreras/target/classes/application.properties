spring.application.name=ms-carreras
server.port=8084

# ===============================
# BASE DE DATOS
# ===============================
# Se agrega un timeout a la URL para que no se quede colgado infinitamente
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL:require}&connectTimeout=30
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Pool (Hikari) para evitar el Timeout en el arranque
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# ===============================
# FLYWAY (ESQUEMA: CARRERAS)
# ===============================
spring.flyway.enabled=true
spring.flyway.table=flyway_schema_history_carreras
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Importante: Flyway debe saber en qué esquema trabajar
spring.flyway.schemas=carreras
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true

# ===============================
# JPA / HIBERNATE
# ===============================
# Forzamos el dialecto para que no falle si la conexión es lenta
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Aseguramos el esquema por defecto para las entidades JPA
spring.jpa.properties.hibernate.default_schema=carreras
# Evita errores adicionales de metadata si la conexión tarda
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false