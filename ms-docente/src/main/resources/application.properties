spring.application.name=ms-docente

# Cambiado a 8082 para evitar conflictos con ms-estudiante (8081)
server.port=8082

# Configuración de Base de Datos (Variables de Entorno)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logs (Ajustado al paquete de este microservicio)
logging.level.com.proyecto.ms_docente=DEBUG
logging.level.org.springframework.web=INFO

# Flyway: El motor de migraciones toma el control
spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath: resources/migration