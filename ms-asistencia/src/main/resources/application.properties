# Nombre de la aplicación
spring.application.name=ms-asistencia

# Puerto: ms-matriculas=8083, ms-notas=8084, ms-asistencia=8085
server.port=8088

# URL del ms-matriculas (para validar que el estudiante tenga matrícula activa)
ms-matriculas.url=${MS_MATRICULAS_URL}

# Conexión a la base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Muestra las consultas SQL en la consola (útil para depurar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logs
logging.level.com.proyecto.ms_asistencia=DEBUG
logging.level.org.springframework.web=INFO

# JPA no toca la estructura de la BD (Flyway se encarga)
spring.jpa.hibernate.ddl-auto=update

# Flyway: migraciones de base de datos
spring.flyway.enabled=true
spring.flyway.table=flyway_schema_history_asistencia
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true
