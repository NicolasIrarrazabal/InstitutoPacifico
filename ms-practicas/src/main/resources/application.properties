spring.application.name=ms-practicas

server.port=8087
# URLs de los microservicios que ms-practicas consume para validar la R5
ms-aranceles.url=${MS_ARANCELES_URL}
ms-notas.url=${MS_NOTAS_URL}
ms-empresas.url=${MS_EMPRESAS_URL}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.com.proyecto.ms_practicas=DEBUG
logging.level.org.springframework.web=INFO

spring.jpa.hibernate.ddl-auto=update

spring.flyway.enabled=true
spring.flyway.table=flyway_schema_history_practicas
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true
