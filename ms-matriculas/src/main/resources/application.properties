spring.application.name=ms-matriculas

server.port=8083

ms-estudiante.url=${MS_ESTUDIANTE_URL}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL:require}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=matriculas

logging.level.com.proyecto.ms_matriculas=DEBUG
logging.level.org.springframework.web=INFO

spring.jpa.hibernate.ddl-auto=update

spring.flyway.enabled=true
spring.flyway.table=flyway_schema_history_matriculas
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true
spring.flyway.schemas=matriculas