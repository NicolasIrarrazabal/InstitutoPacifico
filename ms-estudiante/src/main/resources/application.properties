spring.application.name=ms-estudiante

server.port=8085

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.com.proyecto.ms_estudiante=DEBUG
logging.level.org.springframework.web=INFO

spring.jpa.hibernate.ddl-auto=update

spring.flyway.enabled=true
spring.flyway.table=flyway_schema_history_estudiante
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true
# URLs de microservicios consumidos por ms-estudiante
ms-notas.url=http://localhost:8086
ms-matriculas.url=http://localhost:8083
