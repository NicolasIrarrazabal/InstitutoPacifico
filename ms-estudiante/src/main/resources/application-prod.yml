spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

ms-notas:
  url: ${MS_NOTAS_URL}
ms-matriculas:
  url: ${MS_MATRICULAS_URL}

logging:
  level:
    com.proyecto.ms_estudiante: INFO