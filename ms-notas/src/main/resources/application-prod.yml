spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

ms-matriculas:
  url: ${MS_MATRICULAS_URL}
ms-aranceles:
  url: ${MS_ARANCELES_URL}

logging:
  level:
    com.proyecto.ms_notas: INFO