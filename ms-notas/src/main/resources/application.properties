# Nombre de la aplicación
spring.application.name=ms-notas

# Puerto en el que corre este microservicio
server.port=8086

# URL del microservicio de matrículas (para validar R1)
# Se lee desde el archivo .env
ms-matriculas.url=${MS_MATRICULAS_URL}

# URL del microservicio de aranceles (para validar R4)
# Se lee desde el archivo .env
ms-aranceles.url=${MS_ARANCELES_URL}

# Configuración de la base de datos PostgreSQL
# Las variables ${...} se leen desde el archivo .env
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Muestra las consultas SQL generadas por JPA en la consola (útil para depurar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logs: DEBUG para nuestro código, INFO para el framework
logging.level.com.proyecto.ms_notas=DEBUG
logging.level.org.springframework.web=INFO

# JPA no crea ni borra tablas automáticamente (Flyway se encarga de eso)
spring.jpa.hibernate.ddl-auto=update

# Configuración de Flyway (migraciones de base de datos)
spring.flyway.enabled=true
spring.flyway.table=flyway_schema_history_notas
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true
