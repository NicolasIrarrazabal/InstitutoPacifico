# 1. Identificación del Microservicio
spring.application.name=ms-asignaturas

# 2. Puerto Único
server.port=8084

# 3. Configuración de Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/db_asignaturas
spring.datasource.username=postgres
spring.datasource.password=tu_contraseña
spring.datasource.driver-class-name=org.postgresql.Driver

# 4. Configuración de JPA / Hibernate para PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 5. Configuración de Logs (Requisito SLF4J)
logging.level.cl.duoc.instituto.asignaturas=DEBUG
logging.level.org.springframework.web=INFO