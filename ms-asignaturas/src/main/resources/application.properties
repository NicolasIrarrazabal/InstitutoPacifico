# Identificación
spring.application.name=ms-asignaturas
server.port=8080

# Base de Datos (Asegúrate de tener el archivo .env en la raíz)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway: Forzar la ejecución
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA: Validar solo DESPUÉS de que Flyway cree las tablas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.flyway.repair-on-migrate=true
# Nombre único para la tabla de Flyway de este servicio
spring.flyway.table=flyway_schema_history_asignaturas