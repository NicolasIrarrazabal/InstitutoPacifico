# Identificación del Microservicio
spring.application.name=ms-asignaturas
server.port=8084

# Configuración de Base de Datos (Variables de Entorno)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logs (Requisito SLF4J para Evaluación Parcial 2) [cite: 559]
logging.level.cl.duoc.instituto.asignaturas=DEBUG
logging.level.org.springframework.web=INFO

# Desactivar ddl-auto de Hibernate para usar Flyway
spring.jpa.hibernate.ddl-auto=validate

# Configuración de Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration